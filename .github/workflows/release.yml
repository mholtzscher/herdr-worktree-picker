name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine release
        id: release
        run: python3 scripts/prepare-release.py --github-output "$GITHUB_OUTPUT"

      - name: Test
        if: steps.release.outputs.release == 'true'
        run: |
          python3 -m unittest discover -s tests
          cargo test
          cargo build --release

      - name: Commit and tag
        if: steps.release.outputs.release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock herdr-plugin.toml README.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Publish GitHub release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
